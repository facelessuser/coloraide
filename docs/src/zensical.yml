markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
      permalink: ""
  - smarty:
      smart_quotes: false
  - attr_list:
  - tables:
  - abbr:
  - footnotes:
  - pymdownx.betterem:
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        # Mermaid diagrams
        - name: diagram
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: playground
          class: playground
          format: !!python/object/apply:docs.src.py.notebook.color_command_formatter
            kwds:
              init: |
                import coloraide
                from coloraide import *
                from coloraide.everything import ColorAll as Color
          validator: !!python/name:docs.src.py.notebook.color_command_validator
          reset: !!python/name:docs.src.py.notebook.color_command_reset
        - name: py
          class: 'highlight'
          format: !!python/object/apply:docs.src.py.notebook.color_command_formatter
            kwds:
              init: |
                import coloraide
                from coloraide import *
                from coloraide.everything import ColorAll as Color
          validator: !!python/name:docs.src.py.notebook.color_command_validator
          reset: !!python/name:docs.src.py.notebook.color_command_reset
        - name: python
          class: 'highlight'
          format: !!python/object/apply:docs.src.py.notebook.color_command_formatter
            kwds:
              init: |
                import coloraide
                from coloraide import *
                from coloraide.everything import ColorAll as Color
          validator: !!python/name:docs.src.py.notebook.color_command_validator
          reset: !!python/name:docs.src.py.notebook.color_command_reset
  - pymdownx.highlight:
      line_spans: __codeline
      line_anchors: __codelineno
      anchor_linenums: True
      extend_pygments_lang:
        - name: php-inline
          lang: php
          options:
            startinline: true
        - name: pycon3
          lang: pycon
          options:
            python3: true
  - pymdownx.inlinehilite:
      custom_inline:
        - name: color
          class: color
          format: !!python/object/apply:docs.src.py.notebook.color_formatter
            kwds:
              init: |
                import coloraide
                from coloraide import *
                from coloraide.everything import ColorAll as Color
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
      social_url_shorthand: true
      user: facelessuser
      repo: coloraide
  - pymdownx.tilde:
  - pymdownx.caret:
  - pymdownx.smartsymbols:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.escapeall:
      hardbreak: True
      nbsp: True
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.progressbar:
  - pymdownx.striphtml:
  - pymdownx.snippets:
      base_path:
      - docs/src/markdown/.snippets
      - LICENSE.md
      auto_append:
      - refs.md
      - info-container.md
  - pymdownx.keys:
      separator: "\uff0b"
  - pymdownx.saneheaders:
  - pymdownx.blocks.admonition:
      types:
      - new
      - settings
      - note
      - abstract
      - info
      - tip
      - success
      - question
      - warning
      - failure
      - danger
      - bug
      - example
      - quote
  - pymdownx.blocks.details:
      types:
      - name: details-new
        class: new
      - name: details-settings
        class: settings
      - name: details-note
        class: note
      - name: details-abstract
        class: abstract
      - name: details-info
        class: info
      - name: details-tip
        class: tip
      - name: details-success
        class: success
      - name: details-question
        class: question
      - name: details-warning
        class: warning
      - name: details-failure
        class: failure
      - name: details-danger
        class: danger
      - name: details-bug
        class: bug
      - name: details-example
        class: example
      - name: details-quote
        class: quote
  - pymdownx.blocks.html:
  - pymdownx.blocks.definition:
  - pymdownx.blocks.tab:
      alternate_style: True
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.fancylists:
      inject_style: True
  - pymdownx.blocks.caption:
  - pymdownx.arithmatex:
      generic: true
      block_tag: 'pre'
  - pymdownx.quotes:
      callouts: true
  - pymdownx.bracketspan:

